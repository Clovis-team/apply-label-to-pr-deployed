name: "Apply label to all PR deployed"
description: "Apply label to all PR deployed"
author: "David Alvarez"
branding:
  icon: "package"
  color: "green"
inputs:
  github_token:
    description: "The GitHub token (if not provided the environment variable GITHUB_TOKEN will be used instead)"
    required: false
  repo_name:
    description: "Name of the repository"
    required: true
  repo_owner:
    description: "Owner of the repository"
    required: true
  label_id:
    description: "The label ID to apply"
    required: true
  excluding_label:
    description: "The label name which exclude PR from the script"
    required: false
permissions:
  # cf https://stackoverflow.com/questions/70435286/resource-not-accessible-by-integration-on-github-post-repos-owner-repo-ac
  contents: read
  actions: read
  checks: write
runs:
  using: "node12"
  main: "dist/index.js"
